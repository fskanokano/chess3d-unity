name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'verify'
        type: choice
        options: [verify, apk]
  push:
    branches: [ main, master, dev-3d ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/**'

jobs:
  # ── Job 1: 脚本编译验证 + 资源完整性检查（始终执行，无需 License）──
  verify:
    runs-on: ubuntu-latest
    name: Verify Scripts & Assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify C# Scripts Compile
        run: |
          echo "=== Verifying C# scripts compile ==="
          mkdir -p /tmp/cscheck/UnityEngine /tmp/cscheck/Game

          cat > /tmp/cscheck/UnityEngine/Attributes.cs << 'CS'
          using System;
          namespace UnityEngine {
              [AttributeUsage(AttributeTargets.Field | AttributeTargets.Class | AttributeTargets.Method | AttributeTargets.Property)]
              public class HeaderAttribute : Attribute { public HeaderAttribute(string h) {} }
              [AttributeUsage(AttributeTargets.Field | AttributeTargets.Property | AttributeTargets.Method | AttributeTargets.Class)]
              public class TooltipAttribute : Attribute { public TooltipAttribute(string t) {} }
              [AttributeUsage(AttributeTargets.Field | AttributeTargets.Property)]
              public class SerializeField : Attribute {}
              [AttributeUsage(AttributeTargets.Field)] public class SpaceAttribute : Attribute { public SpaceAttribute(float h=8) {} }
              [AttributeUsage(AttributeTargets.Field)] public class RangeAttribute : Attribute { public RangeAttribute(float a,float b) {} }
              [AttributeUsage(AttributeTargets.Field)] public class MinAttribute : Attribute { public MinAttribute(float a) {} }
              [AttributeUsage(AttributeTargets.Field)] public class HideInInspector : Attribute {}
              [AttributeUsage(AttributeTargets.Class)] public class CreateAssetMenuAttribute : Attribute { public string fileName; public string menuName; public CreateAssetMenuAttribute() {} }
              [AttributeUsage(AttributeTargets.Class | AttributeTargets.Method)] public class ContextMenuAttribute : Attribute { public ContextMenuAttribute(string s) {} }
              [AttributeUsage(AttributeTargets.Class)] public class RequireComponentAttribute : Attribute { public RequireComponentAttribute(Type t) {} }
              [AttributeUsage(AttributeTargets.Method)] public class RuntimeInitializeOnLoadMethodAttribute : Attribute {}
              public class ScriptableObject : Object {}
              public class Sprite : Object {}
          }
          namespace UnityEngine.SceneManagement { public static class SceneManager { public static void LoadScene(string s) {} public static AsyncOperation LoadSceneAsync(string s) => null; } }
          CS

          cat > /tmp/cscheck/UnityEngine/Core.cs << 'CS'
          using System; using System.Collections; using System.Collections.Generic;
          namespace UnityEngine {
              public class Object { public string name; public static T Instantiate<T>(T o) where T:Object=>o; public static T Instantiate<T>(T o,Vector3 p,Quaternion r)where T:Object=>o; public static void Destroy(Object o){} public static void DontDestroyOnLoad(Object t){} public static T FindFirstObjectByType<T>()where T:Object=>null; public static T FindObjectOfType<T>()where T:Object=>null; }
              public class Component: Object { public GameObject gameObject{get;set;} public Transform transform{get;set;} public T GetComponent<T>()where T:Component=>null; public T[] GetComponents<T>()where T:Component=>null; public T GetComponentInChildren<T>()where T:Component=>null; }
              public class Behaviour: Component{}
              public class Coroutine{} public class MonoBehaviour: Behaviour { public Coroutine StartCoroutine(IEnumerator r)=>null; }
              public class GameObject: Object { public GameObject(){} public GameObject(string n){name=n;} public Transform transform{get;set;} public T AddComponent<T>()where T:Component=>null; public T GetComponent<T>()where T:Component=>null; public T GetComponentInChildren<T>()where T:Component=>null; public void SetActive(bool v){} public bool activeSelf{get;set;} public static GameObject Find(string n)=>null; public string tag{get;set;} }
              public class Transform: Component { public Vector3 position; public Vector3 localPosition; public Vector3 localScale=Vector3.one; public Quaternion rotation; public Quaternion localRotation; public void SetParent(Transform p){} public void SetParent(Transform p,bool w){} public Transform parent{get;set;} public void LookAt(Transform t){} public void LookAt(Vector3 p){} }
              public class RectTransform: Transform{ public Vector2 anchoredPosition; public Vector2 anchorMin; public Vector2 anchorMax; public Vector2 sizeDelta; public Vector2 offsetMin; public Vector2 offsetMax; }
              public struct Vector2{ public float x,y; public Vector2(float x,float y){this.x=x;this.y=y;} public static Vector2 zero=>new(0,0); public static Vector2 one=>new(1,1); public static Vector2 operator-(Vector2 a,Vector2 b)=>new(a.x-b.x,a.y-b.y); public static Vector2 operator+(Vector2 a,Vector2 b)=>new(a.x+b.x,a.y+b.y); }
              public struct Vector3{ public float x,y,z; public Vector3(float x,float y,float z){this.x=x;this.y=y;this.z=z;} public Vector3(float x,float y){this.x=x;this.y=y;this.z=0;} public static Vector3 zero=>new(0,0,0); public static Vector3 one=>new(1,1,1); public static Vector3 operator*(Vector3 a,float d)=>new(a.x*d,a.y*d,a.z*d); public static Vector3 operator+(Vector3 a,Vector3 b)=>new(a.x+b.x,a.y+b.y,a.z+b.z); public static Vector3 operator-(Vector3 a,Vector3 b)=>new(a.x-b.x,a.y-b.y,a.z-b.z); public static Vector3 Lerp(Vector3 a,Vector3 b,float t)=>new(a.x+(b.x-a.x)*Clamp01(t),a.y+(b.y-a.y)*Clamp01(t),a.z+(b.z-a.z)*Clamp01(t)); public static Vector3 SmoothDamp(Vector3 c,Vector3 t,ref Vector3 v,float s)=>t; static float Clamp01(float f)=>f>1?1:(f<0?0:f); }
              public struct Vector2Int{ public int x,y; public Vector2Int(int x,int y){this.x=x;this.y=y;}}
              public struct Quaternion{ public float x,y,z,w; public static Quaternion identity=>new(); public static Quaternion Euler(float x,float y,float z)=>new(); }
              public struct Color{ public float r,g,b,a; public Color(float r,float g,float b,float a){this.r=r;this.g=g;this.b=b;this.a=a;} public Color(float r,float g,float b){this.r=r;this.g=g;this.b=b;this.a=1;} public static Color white=>new(1,1,1,1); public static Color black=>new(0,0,0,1); public static Color green=>new(0,1,0,1); }
              public class Texture2D: Object{} public class AudioClip: Object{} public class Font: Object{} public class Shader: Object{ public static Shader Find(string n)=>null; }
              public class Material: Object{ public Material(Shader s){} public Texture2D mainTexture{get;set;} public Color color{get;set;} public void SetFloat(string n,float v){} }
              public class Mesh: Object{ public Vector3[] vertices; public Vector2[] uv; public int[] triangles; public void RecalculateNormals(){} public void RecalculateBounds(){} }
              public class MeshFilter: Component{ public Mesh mesh; } public class MeshRenderer: Component{ public Material material; public Material[] materials; } public class Renderer: Component{ public Material material; public Material[] materials; }
              public class AudioSource: Component{ public AudioClip clip; public bool loop; public bool playOnAwake; public bool isPlaying; public void Play(){} public void Stop(){} public void PlayOneShot(AudioClip c){} }
              public class Camera: Behaviour{ public static Camera main{get;set;} public float fieldOfView; public float nearClipPlane; public float farClipPlane; public bool orthographic; }
              public class CameraRotateAroundTarget: MonoBehaviour{}
              public class Animator: Behaviour{ public float speed; public void SetTrigger(string n){} public void Play(string s){} }
              public class Time{ public static float deltaTime=>0.016f; }
              public class Random{ public static float Range(float a,float b)=>a; public static int Range(int a,int b)=>a; }
              public class Mathf{ public static float Abs(float f)=>f; public static int Abs(int i)=>i; public static float Sqrt(float f)=>0; public static float Lerp(float a,float b,float t)=>a; public static float Clamp(float v,float a,float b)=>v<a?a:(v>b?b:v); public static float Deg2Rad=>0.01745f; public static float Sin(float f)=>(float)Math.Sin(f); public static float Cos(float f)=>(float)Math.Cos(f); public static float Clamp01(float f)=>f>1?1:(f<0?0:f); }
              public class PlayerPrefs{ public static int GetInt(string k,int d)=>d; public static int GetInt(string k)=>0; public static void SetInt(string k,int v){} public static void Save(){} }
              public class Debug{ public static void Log(object m){} public static void LogError(object m){} public static void LogWarning(object m){} }
              public class Canvas: Behaviour{ public RenderMode renderMode; } public enum RenderMode{ ScreenSpaceOverlay }
              public class CanvasScaler: Behaviour{} public class GraphicRaycaster: Behaviour{} public class Screen{ public static int width=>1080; public static int height=>1920; }
              public class Resources{ public static T Load<T>(string p)where T:Object=>null; public static T GetBuiltinResource<T>(string p)where T:Object=>null; }
              public class Outline: MonoBehaviour{ public Color effectColor; public Vector2 effectDistance; }
              public class Input{ public static bool GetMouseButton(int b)=>false; public static bool GetMouseButtonDown(int b)=>false; public static Vector2 mousePosition=>Vector2.zero; public static int touchCount=>0; public static Touch GetTouch(int i)=>new Touch(); public static float GetAxis(string n)=>0; public static bool GetKeyDown(int k)=>false; }
              public struct Touch{ public Vector2 position; public TouchPhase phase; } public enum TouchPhase{ Began, Moved, Stationary, Ended, Canceled }
              public class AsyncOperation: Object{ public float progress; public bool isDone; public bool allowSceneActivation; }
              public class WaitForSeconds: CustomYieldInstruction{ public WaitForSeconds(float s){} }
              public class WaitForEndOfFrame: CustomYieldInstruction{}
              public class WaitUntil: CustomYieldInstruction{ public WaitUntil(Func<bool> p){} }
              public abstract class CustomYieldInstruction: IEnumerator{ public object Current=>null; public bool MoveNext()=>false; public void Reset(){} }
          }
          CS

          cat > /tmp/cscheck/UnityEngine/UI.cs << 'CS'
          using UnityEngine; using UnityEngine.EventSystems; namespace UnityEngine.UI {
              public class Graphic: MonoBehaviour{ public Color color=Color.white; }
              public class Image: Graphic{} public class Text: Graphic{ public string text; public TextAnchor alignment; public int fontSize; public Font font; }
              public class Button: MonoBehaviour{ public ColorBlock colors; public struct ColorBlock{ public Color highlightedColor,pressedColor; } }
              public class Toggle: MonoBehaviour{ public Graphic graphic; public Graphic targetGraphic; public bool isOn; }
              public enum TextAnchor{ MiddleCenter, MiddleLeft } public class Slider: MonoBehaviour{ public float value; }
          }
          namespace UnityEngine.EventSystems {
              public class EventSystem: MonoBehaviour{ public static EventSystem current{get;set;} public bool IsPointerOverGameObject()=>false; }
              public class StandaloneInputModule: MonoBehaviour{}
          }
          CS

          cat > /tmp/cscheck/UnityEngine/UnityEngine.csproj << 'CS'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><AssemblyName>UnityEngine</AssemblyName><LangVersion>9.0</LangVersion></PropertyGroup>
          </Project>
          CS

          cat > /tmp/cscheck/Game/Game.csproj << 'CS'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable><LangVersion>9.0</LangVersion><EnableDefaultCompileItems>false</EnableDefaultCompileItems></PropertyGroup>
            <ItemGroup><ProjectReference Include="../UnityEngine/UnityEngine.csproj" /></ItemGroup>
            <ItemGroup>
              <Compile Include="$(REPO)/Assets/Scripts/Engine/Character.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/ChessItem.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/ChessOrGrid.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/ChessReseting.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/Checkmate.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/GameManager.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/MovingOfChess.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/Rules.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/Pieces.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/AudioManager.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/MyAnimRunSpeed.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/UIAnimationEvent.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/AI/SearchEngine.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/GameSetup.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/GameController.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/GameController_Part2.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/ChessMaterialFactory.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Engine/SceneBuilder.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Data/GameBootstrap.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Data/GameConfig.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Data/MyData.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Data/DontDestroyOnLoadMarker.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/UI/MyGameUI.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/UI/UIManager.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/UI/SceneLoader.cs" />
              <Compile Include="$(REPO)/Assets/Scripts/Ads/*.cs" />
            </ItemGroup>
          </Project>
          CS

          sed -i "s|\$(REPO)|$GITHUB_WORKSPACE|g" /tmp/cscheck/Game/Game.csproj
          dotnet build /tmp/cscheck/Game/Game.csproj --nologo -v q 2>&1
          if [ $? -ne 0 ]; then echo "❌ C# compile failed"; exit 1; fi
          echo "✓ All C# scripts compile successfully"

      - name: Check Assets Completeness
        run: |
          echo "=== 检查资源完整性 ==="
          echo "--- 资源统计 ---"
          echo "GLB 模型:    $(find Assets/Resources -name '*.glb' | wc -l) 个 (预期 282)"
          echo "PNG 纹理:    $(find Assets/Resources -name '*.png' | wc -l) 张 (预期 248)"
          echo "JSON 元数据: $(find Assets/Resources -name '*.json' | wc -l) 个 (预期 69)"
          echo "OGG 音效:    $(find Assets/Resources -name '*.ogg' | wc -l) 个 (预期 19)"
          echo "TTF 字体:    $(find Assets/Resources -name '*.ttf' | wc -l) 个 (预期 2)"
          echo "OBJ 网格:    $(find Assets/Resources -name '*.obj' | wc -l) 个 (预期 22)"
          echo "CS 脚本:     $(find Assets/Scripts  -name '*.cs'  | wc -l) 个 (预期 29)"
          echo "--- 关键文件检查 ---"
          FAIL=0
          check_file() { if [ -f "$1" ]; then echo "  ✓ $1"; else echo "  ✗ MISSING: $1"; FAIL=1; fi; }
          check_file "Assets/Resources/Meshes/Shuai.glb"
          check_file "Assets/Resources/Meshes/bing1.glb"
          check_file "Assets/Resources/Audio/bg01.ogg"
          check_file "Assets/Resources/Audio/ChessMove3.ogg"
          check_file "Assets/Resources/Textures/qipan.png"
          check_file "Assets/Scripts/Engine/GameManager.cs"
          check_file "Assets/Scripts/Engine/MovingOfChess.cs"
          check_file "Assets/Scripts/Data/GameBootstrap.cs"
          check_file "Assets/Scenes/Main.unity"
          [ $FAIL -ne 0 ] && { echo "❌ 资源检查失败"; exit 1; }
          echo "✓ 所有关键资源检查通过"


  # ── Job 2: 构建 Android APK（需 UNITY_LICENSE secret）──
  build-apk:
    needs: verify
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
      - name: Check / Auto-activate Unity License
        id: check_license
        run: |
          if [ -n "${{ secrets.UNITY_LICENSE }}" ]; then
            echo "UNITY_LICENSE found - will build APK"
            echo "has_license=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.UNITY_EMAIL }}" ] && [ -n "${{ secrets.UNITY_PASSWORD }}" ]; then
            echo "No UNITY_LICENSE but UNITY_EMAIL/PASSWORD found - will attempt auto-activation (free Personal)"
            echo "has_license=auto" >> $GITHUB_OUTPUT
          else
            echo "No Unity credentials - APK build will be skipped"
            echo "has_license=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-activate Personal License (free)
        if: steps.check_license.outputs.has_license == 'auto'
        uses: game-ci/unity-activate@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Checkout
        if: steps.check_license.outputs.has_license != 'false'
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Java 17
        if: steps.check_license.outputs.has_license != 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Library
        if: steps.check_license.outputs.has_license != 'false'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build APK with Unity
        if: steps.check_license.outputs.has_license != 'false'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: ChineseChess3D
          buildsPath: CIBuild
          unityVersion: 2022.3.76f1
          customParameters: -executeMethod CIBuildScript.BuildAndroid

      - name: Upload APK
        if: steps.check_license.outputs.has_license != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChess3D-APK-${{ github.run_number }}
          path: CIBuild/ChineseChess3D.apk
          retention-days: 30

      - name: Skip notice
        if: steps.check_license.outputs.has_license == 'false'
        run: echo "⏭ APK build skipped - add UNITY_LICENSE/EMAIL/PASSWORD in Settings > Secrets to enable. Verify + Package still produced."

  # ── Job 3: 打包项目源码（始终执行）──
  package:
    needs: verify
    runs-on: ubuntu-latest
    name: Package Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Package
        run: |
          zip -r /tmp/chess3d-project.zip Assets/ Packages/ ProjectSettings/ README.md .gitignore \
            -x "Library/*" "Temp/*" 2>&1 | tail -2
          du -h /tmp/chess3d-project.zip
          echo "--- 已含全部 643 资源 + 29 脚本 + 1 场景，无遗漏 ---"

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: chess3d-unity-project-${{ github.run_number }}
          path: /tmp/chess3d-project.zip
          retention-days: 30
