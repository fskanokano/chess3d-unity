name: Generate ALF

on:
  workflow_dispatch:

jobs:
  gen-alf:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ALF
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            unityci/editor:ubuntu-2022.3.76f1-base-3 \
            /opt/unity/Editor/Unity -batchmode -nographics -quit \
            -createManualActivationFile -logFile /dev/stdout 2>&1 | tail -20 || true
          echo "---"
          find . -name "*.alf" -o -name "Unity*.alf" 2>/dev/null | head -5
          ls -la *.alf 2>/dev/null | head -5 || echo "no alf in PWD, checking /tmp"
          find / -name "*.alf" 2>/dev/null | head -5 || true
      - name: Upload ALF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity_ALF
          path: "*.alf"
          if-no-files-found: warn
